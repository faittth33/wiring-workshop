<div id="k23-practice">
<div class="k23-heading"><h2>K2-3 · 照明接线实操</h2><span class="viz-badge" id="k23-power-tag">总电源断开</span></div>
<div class="viz-controls"><button type="button" class="btn btn-primary" id="k23-power">送电并合闸</button><button type="button" class="btn" id="k23-check">检查接线</button><button type="button" class="btn btn-ghost" id="k23-hint">下一根提示</button><button type="button" class="btn btn-ghost" id="k23-demo">完整参考接线</button><button type="button" class="btn btn-ghost" id="k23-undo">撤销</button><button type="button" class="btn btn-ghost" id="k23-new">清空练习</button></div>
<div class="viz-controls"><label class="form-label">导线颜色<select class="form-select" id="k23-color"><option value="red">红 · L</option><option value="blue">蓝 · N</option><option value="pink">粉 · 开关回路</option><option value="purple">紫 · 表后连线</option><option value="green">绿 · 双控转换线</option><option value="orange">橙 · 插座 L</option><option value="pe">黄绿 · PE</option></select></label><label class="form-label">视图<select class="form-select" id="k23-view"><option value="board">实物接线板</option><option value="scheme">电路原理图</option></select></label><label class="form-check"><input type="checkbox" class="form-check-input" id="k23-flow" checked><span class="form-check-label">显示带电线路</span></label></div>
<div class="viz-row text-small k23-counts"><span id="k23-count" class="tabular-nums">17 根导线</span><span>30 个接线孔</span><span>L—N · 220 V</span></div>
<div id="k23-message" class="text-small k23-message" aria-live="polite">参考接线已装入，总电源断开。</div><div id="k23-focus" class="text-small k23-focus" aria-live="polite">点击导线可高亮两端；点击两个孔可接线。</div><div id="k23-result" hidden></div>
<div class="k23-visual"><svg id="k23-board" class="k23-board" role="img" aria-label="单相电能表、漏电保护器、插座、双控灯和日光灯接线台架"></svg><svg id="k23-scheme" class="k23-scheme" role="img" aria-label="K2-3照明电路原理图" hidden></svg></div>
<div class="viz-row k23-status text-small" aria-live="polite"><span id="k23-meter-status">电能表：未供电</span><span id="k23-rcd-status">RCD：分闸</span><span id="k23-xs-status">插座：0 V</span><span id="k23-el-status">双控灯：灭</span><span id="k23-fl-status">日光灯：灭</span></div>
<div class="viz-controls"><button type="button" class="btn" id="k23-sa1" aria-pressed="false">SA1 · 转换</button><button type="button" class="btn" id="k23-sa2" aria-pressed="false">SA2 · 转换</button><button type="button" class="btn" id="k23-sa3" aria-pressed="false">SA3 · 闭合</button><button type="button" class="btn" id="k23-rcd">RCD · 合闸</button><button type="button" class="btn" id="k23-test">漏保试验</button><button type="button" class="btn" id="k23-leak">模拟漏电</button></div>
<details class="k23-details"><summary>键盘接线／拆线</summary><div class="viz-controls"><label class="form-label">起点<select class="form-select" id="k23-from"></select></label><label class="form-label">终点<select class="form-select" id="k23-to"></select></label><button type="button" class="btn" id="k23-connect">连接</button><button type="button" class="btn btn-ghost" id="k23-delete" disabled>拆除所选导线</button></div><div id="k23-selected" class="text-small">未选择孔位</div></details>
<details class="k23-details" id="k23-wire-details"><summary id="k23-wire-summary">导线清单 · 17 根</summary><table class="table table-sm"><thead><tr><th>导线</th><th>起点 → 终点</th><th>操作</th></tr></thead><tbody id="k23-wire-list"></tbody></table></details>
</div>
<style>

@media(max-width:520px){#k23-practice .k23-heading{padding-right:0;padding-top:12px}}
</style>
<script>
(() => {
'use strict';
const root=document.getElementById('k23-practice'),$=id=>root.querySelector('#k23-'+id),NS='http://www.w3.org/2000/svg';
const nodes=[],nodeMap=new Map();
const devices=[{id:'SUP',name:'电源 · L / N / PE',sub:'台架电源接线孔',kind:'source',height:130},{id:'WH',name:'单相电能表 · kWh',sub:'1进L · 2出L · 3进N · 4出N',kind:'meter',height:220},{id:'RCD',name:'漏电保护器 · RCD',sub:'双极同时通断 L 与 N',kind:'rcd',height:220},{id:'XS',name:'插座 · XS',sub:'上PE · 左N · 右L',kind:'socket',height:224},{id:'SA1',name:'SA1 · 双控',sub:'C公共端 · T1 / T2转换端',kind:'two-way',height:224},{id:'SA2',name:'SA2 · 双控',sub:'C公共端 · T1 / T2转换端',kind:'two-way',height:224},{id:'SA3',name:'SA3 · 单控',sub:'日光灯开关',kind:'single',height:224},{id:'EL',name:'灯座 · EL',sub:'双控照明灯',kind:'lamp',height:220},{id:'BL',name:'镇流器 · BL',sub:'左侧输入 · 右侧灯管输出',kind:'ballast',height:220},{id:'FL',name:'日光灯管 · FL',sub:'按视频台架的两端引出孔',kind:'tube',height:160}];
function add(id,dev,label,desc,cap=1){const n={id,dev,label,desc,cap};nodes.push(n);nodeMap.set(id,n);}
['L','N','PE'].forEach(p=>add('SUP.'+p,'SUP',p,p==='PE'?'保护地':'单相电源'+p));
for(let i=1;i<=4;i++)add('WH.'+i,'WH',String(i),['火线进','火线出','零线进','零线出'][i-1]);
['Lin','Nin','Lout','Nout'].forEach(p=>add('RCD.'+p,'RCD',{Lin:'L↑',Nin:'N↑',Lout:'L↓',Nout:'N↓'}[p],p.endsWith('in')?'漏保输入端':'漏保输出端',p.endsWith('out')?3:1));
['PE','N','L'].forEach(p=>add('XS.'+p,'XS',p,'插座'+(p==='PE'?'保护地':p+'端')));
for(const dev of['SA1','SA2'])['T1','T2','C'].forEach(p=>add(dev+'.'+p,dev,p,p==='C'?'双控开关公共端':'双控开关转换端'+p.slice(-1)));
['in','out'].forEach(p=>add('SA3.'+p,'SA3',p==='in'?'进':'出','单控开关'+(p==='in'?'输入':'输出')));
['N','L'].forEach(p=>add('EL.'+p,'EL',p,'灯座'+p+'引出孔'));
['Lin','Nin','Lout','Nout'].forEach(p=>add('BL.'+p,'BL',{Lin:'L入',Nin:'N入',Lout:'灯右',Nout:'灯左'}[p],{Lin:'视频左上输入孔',Nin:'视频左下输入孔',Lout:'视频右上输出孔，接灯管右侧',Nout:'视频右下输出孔，接灯管左侧'}[p]));
add('FL.left','FL','左','灯管左侧引出孔');add('FL.right','FL','右','灯管右侧引出孔');
const reference=[];function ref(a,b,color,why){reference.push({a,b,color,why});}
ref('SUP.L','WH.1','red','火线进入电能表1孔');ref('SUP.N','WH.3','blue','零线进入电能表3孔');
ref('WH.2','RCD.Lin','pink','电能表2孔输出火线到漏保上端L');ref('WH.4','RCD.Nin','purple','电能表4孔输出零线到漏保上端N');
ref('RCD.Lout','XS.L','orange','漏保输出火线接插座右L');ref('RCD.Nout','XS.N','blue','漏保输出零线接插座左N');ref('SUP.PE','XS.PE','pe','保护地直接接插座上PE，独立于漏保');
ref('RCD.Lout','SA1.C','pink','漏保输出火线接第一个双控公共端');ref('SA1.T1','SA2.T1','green','两个双控开关的左转换端相连');ref('SA1.T2','SA2.T2','green','两个双控开关的右转换端相连');
ref('SA2.C','EL.L','pink','第二个双控公共端接灯座火线');ref('RCD.Nout','EL.N','purple','漏保输出零线直接接灯座另一孔');
ref('RCD.Lout','SA3.in','pink','漏保输出火线进入单控开关');ref('SA3.out','BL.Lin','pink','开关输出接镇流器左上输入孔');ref('RCD.Nout','BL.Nin','blue','漏保输出零线接镇流器左下输入孔');
ref('BL.Lout','FL.right','pink','镇流器右上输出接灯管右孔');ref('BL.Nout','FL.left','blue','镇流器右下输出接灯管左孔');
const colorNames={red:'红',blue:'蓝',pink:'粉',purple:'紫',green:'绿',orange:'橙',pe:'黄绿'},colorValues={red:'var(--red)',blue:'var(--blue)',pink:'color-mix(in srgb,var(--purple) 55%,var(--red))',purple:'var(--purple)',green:'var(--green)',orange:'var(--orange)',pe:'var(--green)'};
const model={version:1,circuit:'K2-3照明接线',nodes,devices,reference,source:'BV1dvX3YAEhd'};
let wires=[],nextId=1,selected=null,selectedWire=null,hints=[],invalid=[],undo=[],result=null;
let power=false,rcdClosed=false,tripped=false,leakage=false,switches={SA1:0,SA2:1,SA3:false};
let meterPowered=false,socketV=0,lampOn=false,ballastPowered=false,tubeOn=false,graph=null,view='board',flow=true,positions=new Map(),boxMap=new Map();
const stateOrigin='k23-'+Math.random().toString(36).slice(2);
function label(id){const n=nodeMap.get(id);return n.dev+' · '+n.label;}
class DSU{constructor(){this.p=new Map(nodes.map(n=>[n.id,n.id]));}find(a){let p=this.p.get(a);if(p!==a){p=this.find(p);this.p.set(a,p);}return p;}join(a,b){if(!this.p.has(a)||!this.p.has(b))return;let x=this.find(a),y=this.find(b);if(x!==y)this.p.set(x,y);}same(a,b){return this.find(a)===this.find(b);}}
function bare(){const d=new DSU();wires.forEach(w=>d.join(w.a,w.b));return d;}
const expected=new DSU();reference.forEach(w=>expected.join(w.a,w.b));
const expectedGroups=new Map();nodes.forEach(n=>{const k=expected.find(n.id);if(!expectedGroups.has(k))expectedGroups.set(k,[]);expectedGroups.get(k).push(n.id);});
const usefulGroups=[...expectedGroups.values()].filter(g=>g.length>1);
function count(id){return wires.filter(w=>w.a===id||w.b===id).length;}
function pushUndo(){undo.push(wires.map(w=>({...w})));if(undo.length>35)undo.shift();}
function message(s,error=false){$('message').textContent=s;$('message').classList.toggle('text-destructive',error);}
function focusedWire(){return wires.find(w=>w.id===selectedWire)||null;}
function save(){if(!window.openai||typeof window.openai.setWidgetState!=='function')return;const focus=focusedWire();const privateContent={version:1,circuit:model.circuit,origin:stateOrigin,wires:wires.map(({a,b,color,id})=>({a,b,color,id})),color:$('color').value,view,flow,switches:{...switches},wireFocus:focus?{a:focus.a,b:focus.b}:null};const modelContent={circuit:model.circuit,video:model.source,wireCount:wires.length,correct:result?result.ok:null,selectedWire:focus?{id:focus.id,a:focus.a,b:focus.b}:null,switches:{...switches},simulation:{power,rcdClosed,tripped,leakage,lampOn,tubeOn,socketV},connections:wires.map(w=>[w.a,w.b])};window.openai.setWidgetState({modelContent,privateContent}).catch(()=>{});}
function restore(snapshot){const s=snapshot?.privateContent||snapshot;if(!s||s.version!==1||s.circuit!==model.circuit||!Array.isArray(s.wires)||s.origin===stateOrigin)return;const focus=focusedWire(),packed=ws=>JSON.stringify(ws.map(w=>[w.a,w.b,w.color,w.id]));if(packed(s.wires)===packed(wires)&&s.view===view&&s.flow===flow&&s.color===$('color').value&&JSON.stringify(s.switches)===JSON.stringify(switches)&&JSON.stringify(s.wireFocus||null)===JSON.stringify(focus?{a:focus.a,b:focus.b}:null))return;
wires=s.wires.filter(w=>nodeMap.has(w.a)&&nodeMap.has(w.b)&&w.a!==w.b&&colorValues[w.color]).slice(0,60).map((w,i)=>({...w,id:i+1}));nextId=wires.length+1;power=false;rcdClosed=false;tripped=false;leakage=false;switches={SA1:s.switches?.SA1===1?1:0,SA2:s.switches?.SA2===1?1:0,SA3:s.switches?.SA3===true};if(colorValues[s.color])$('color').value=s.color;view=s.view==='scheme'?'scheme':'board';flow=s.flow!==false;$('view').value=view;$('flow').checked=flow;selected=null;selectedWire=wires.find(w=>(w.a===s.wireFocus?.a&&w.b===s.wireFocus?.b)||(w.b===s.wireFocus?.a&&w.a===s.wireFocus?.b))?.id||null;hints=[];invalid=[];undo=[];result=null;settle();renderAll();message('已恢复接线进度，总电源保持断开。');}
function check(render=true){const d=bare(),errors=[],bad=new Set();let complete=0;wires.forEach(w=>{if(!expected.same(w.a,w.b)){errors.push('误接：'+label(w.a)+' → '+label(w.b)+'，两孔不属于同一电气节点。');bad.add(w.a);bad.add(w.b);}if((w.a.endsWith('.PE')||w.b.endsWith('.PE'))&&w.color!=='pe'){errors.push('保护地线需使用黄绿色：'+label(w.a)+' → '+label(w.b));bad.add(w.a);bad.add(w.b);}else if(w.color==='pe'&&!w.a.endsWith('.PE')&&!w.b.endsWith('.PE')){errors.push('黄绿线仅用于PE：'+label(w.a)+' → '+label(w.b));bad.add(w.a);bad.add(w.b);}});
nodes.forEach(n=>{if(count(n.id)>n.cap){errors.push(label(n.id)+'超过'+n.cap+'根导线。');bad.add(n.id);}});usefulGroups.forEach(g=>{if(g.every(n=>d.same(n,g[0])))complete++;else{const clusters=new Map();g.forEach(n=>{const k=d.find(n);if(!clusters.has(k))clusters.set(k,[]);clusters.get(k).push(n);});errors.push('缺线：'+[...clusters.values()].map(ns=>ns.map(label).join('、')).join(' ↔ '));g.forEach(n=>bad.add(n));}});if(wires.length>reference.length&&errors.length===0)errors.push('存在多余环线；参考接线为17根，请先拆除冗余线。');result={ok:errors.length===0,errors,complete,total:usefulGroups.length};invalid=[...bad];if(render){showResult();message(result.ok?'检查通过：13组节点正确，17根导线，插座PE完整。':'发现'+errors.length+'项问题。',!result.ok);renderBoard();save();}return result;}
function showResult(){const el=$('result');el.replaceChildren();el.hidden=!result;if(!result)return;el.setAttribute('role',result.ok?'status':'alert');const line=document.createElement('div');line.className=result.ok?'text-small':'text-small text-destructive';line.textContent=(result.ok?'检查通过':'检查未通过')+' · 电气节点 '+result.complete+' / '+result.total;el.append(line);if(result.errors.length){const det=document.createElement('details');det.open=true;const sum=document.createElement('summary');sum.textContent='查看 '+result.errors.length+' 项检查结果';det.append(sum);const ul=document.createElement('ul');ul.className='k23-findings text-small';result.errors.slice(0,15).forEach(e=>{const li=document.createElement('li');li.textContent=e;ul.append(li);});det.append(ul);el.append(det);}}
function canEdit(){if(power){message('先断开总电源，再修改接线；漏保分闸后其输入侧仍有电。',true);return false;}return true;}
function connect(a,b,color=$('color').value){if(!canEdit())return false;if(!nodeMap.has(a)||!nodeMap.has(b)||!colorValues[color]){message('请选择有效孔位和导线颜色。',true);return false;}if(a===b){message('起终点不能是同一个孔。',true);return false;}if(wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a))){message('这两个孔已相连。',true);return false;}if(count(a)>=nodeMap.get(a).cap||count(b)>=nodeMap.get(b).cap){message('孔位已满：漏保输出L、N各可接3根，其余孔各1根。',true);return false;}pushUndo();wires.push({id:nextId++,a,b,color});selected=null;selectedWire=null;hints=[];invalid=[];result=null;message('已接：'+label(a)+' → '+label(b));settle();renderAll();save();return true;}
function removeWire(id){if(!canEdit()||!wires.some(w=>w.id===id))return;pushUndo();wires=wires.filter(w=>w.id!==id);selectedWire=null;result=null;invalid=[];hints=[];message('所选导线已拆除。');settle();renderAll();save();}
function pickNode(id){const n=nodeMap.get(id);$('selected').textContent=label(id)+' · '+n.desc+' · '+count(id)+' / '+n.cap+' 根';if(power){message('总电源已接通：'+label(id)+'。先断开总电源再接线。');return;}if(selected===id){selected=null;message('已取消起点。');}else if(!selected){selected=id;selectedWire=null;$('from').value=id;message('起点：'+label(id)+'；请选择终点。');}else{$('to').value=id;connect(selected,id);return;}renderBoard();updateControls();}
function clearWireFocus(persist=true){selectedWire=null;selected=null;$('selected').textContent='未选择孔位';renderBoard();updateControls();if(persist)save();}
function selectWire(id){const w=wires.find(w=>w.id===id);if(!w)return;if(selectedWire===id){clearWireFocus();return;}selectedWire=id;selected=null;$('selected').textContent='导线'+id+' · '+label(w.a)+' → '+label(w.b);$('color').value=w.color;message('导线'+id+'已高亮，两端孔位已标记。');renderBoard();updateControls();save();}

function buildGraph(){const d=bare();d.join('WH.1','WH.2');d.join('WH.3','WH.4');if(rcdClosed&&!tripped){d.join('RCD.Lin','RCD.Lout');d.join('RCD.Nin','RCD.Nout');}for(const key of['SA1','SA2'])d.join(key+'.C',key+'.T'+(switches[key]+1));if(switches.SA3)d.join('SA3.in','SA3.out');return d;}
