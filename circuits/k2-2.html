<div id="k22-practice">
<div class="k22-heading">
  <div><h2>K2-2 · 电工接线实操</h2><div class="text-small text-muted">接触器互锁正反转 · 按视频孔位复原</div></div>
  <span class="viz-badge" id="k22-power-tag">已断电</span>
</div>
<div class="viz-controls k22-toolbar">
  <button type="button" class="btn btn-primary" id="k22-check">检查接线</button>
  <button type="button" class="btn" id="k22-power">合闸试运行</button>
  <button type="button" class="btn btn-ghost" id="k22-hint">下一根提示</button>
  <button type="button" class="btn btn-ghost" id="k22-demo">完整参考接线</button>
  <button type="button" class="btn btn-ghost" id="k22-undo">撤销</button>
  <button type="button" class="btn btn-ghost" id="k22-new">清空练习</button>
</div>
<div class="viz-controls">
  <label class="form-label">导线颜色<select class="form-select" id="k22-color">
    <option value="yellow">黄 · L1</option><option value="green">绿 · L2</option>
    <option value="red">红 · L3</option><option value="purple">紫 · 控制馈电</option>
    <option value="orange">橙 · 按钮公共端</option><option value="pink">粉 · 线圈／启动</option>
    <option value="teal">青 · 反转／互锁</option><option value="blue">蓝 · 线圈回路</option><option value="pe">黄绿 · PE</option>
  </select></label>
  <label class="form-label">视图<select class="form-select" id="k22-view"><option value="board">接线板</option><option value="scheme">电路原理图</option></select></label>
  <label class="form-check"><input type="checkbox" class="form-check-input" id="k22-flow" checked><span class="form-check-label">显示带电线路</span></label>
</div>
<div class="viz-row text-small k22-counts">
  <span id="k22-count" class="tabular-nums">导线 0 / 35</span>
  <span>台架 68 孔 ＋ 电机 4 端子</span><span>练习单孔最多 2 根</span>
  <span>控制电源 L1－L2 · 380 V</span>
</div>
<div id="k22-message" class="k22-message text-small" aria-live="polite">先点起点孔，再点终点孔接线。点导线可选中拆除。</div>
<div id="k22-focus" class="text-small k22-focus" aria-live="polite">点击任意导线高亮；再点同一根或图中空白处取消。</div>
<div id="k22-result" hidden></div>
<div class="k22-visual">
  <svg id="k22-board" class="k22-board" role="img" aria-label="K2-2接线板，台架68插孔与电机4端子"></svg>
  <svg id="k22-scheme" class="k22-scheme" role="img" aria-label="三相电机接触器互锁正反转原理图" hidden></svg>
</div>
<div class="viz-row k22-status" aria-live="polite">
  <span id="k22-km-status">KM1：释放 · KM2：释放</span><span id="k22-motor-status">电机：停止</span>
  <span id="k22-coil-status" class="tabular-nums">线圈：0 V</span><span id="k22-fr-status">FR：正常</span>
</div>
<div class="viz-controls">
  <button type="button" class="btn" id="k22-sb1" aria-pressed="false">按 SB1 · 正转启动</button>
  <button type="button" class="btn" id="k22-sb2" aria-pressed="false">按 SB2 · 反转启动</button>
  <button type="button" class="btn" id="k22-sb3" aria-pressed="false">按 SB3 · 停止</button>
  <button type="button" class="btn" id="k22-trip">FR · 模拟过载</button>
  <button type="button" class="btn btn-ghost" id="k22-fr-reset" disabled>FR · 复位</button>
</div>
<details class="k22-details">
  <summary>用键盘接线／所选孔位</summary>
  <div class="viz-controls">
    <label class="form-label">起点<select class="form-select" id="k22-from"></select></label>
    <label class="form-label">终点<select class="form-select" id="k22-to"></select></label>
    <button type="button" class="btn" id="k22-connect">连接</button>
    <button type="button" class="btn btn-ghost" id="k22-delete" disabled>拆除所选导线</button>
  </div>
  <div id="k22-selected" class="text-small" aria-live="polite">未选择孔位</div>
</details>

  <table class="table table-sm"><thead><tr><th>导线</th><th>起点 → 终点</th><th>操作</th></tr></thead><tbody id="k22-wire-list"></tbody></table>
</details>
<details class="k22-details">
  <summary>视频来源</summary>
  <div class="text-small k22-evidence">
    <a href="https://www.bilibili.com/video/BV1t8c8eZE1t" target="_blank" rel="noopener noreferrer">轻松学电工 · 原视频（4分01秒）</a>
  </div>
</details>
</div>

<script>
(() => {
'use strict';
const root=document.getElementById('k22-practice');
const $=id=>root.querySelector('#k22-'+id);
const NS='http://www.w3.org/2000/svg';
const nodes=[],nodeMap=new Map();
const devices=[
{id:'QF',name:'电源 · QF',sub:'三相输出＋PE',kind:'source',height:162},
{id:'FU',name:'熔断器 · FU1－FU5',sub:'前三只主回路，后两只控制回路',kind:'fuse',height:170},
{id:'KM1',name:'交流接触器 · KM1 正转',sub:'右侧 NO₂ 自锁；NC₂ 互锁',kind:'contactor',height:264},
{id:'KM2',name:'交流接触器 · KM2 反转',sub:'右侧 NO₂ 自锁；NC₁ 互锁',kind:'contactor',height:264},
{id:'FR',name:'热继电器 · FR',sub:'95－96 常闭，97－98 常开',kind:'relay',height:234},
{id:'M',name:'电机 · M 3~',sub:'正转 L1-L2-L3；反转 L3-L2-L1',kind:'motor',height:170},
{id:'SB1',name:'SB1 · 正转启动',sub:'左 NO 3－4；右 NC 空置',kind:'button',height:208},
{id:'SB2',name:'SB2 · 反转启动',sub:'左 NO 3－4；右 NC 空置',kind:'button',height:208},
{id:'SB3',name:'SB3 · 停止',sub:'右 NC 1－2；左 NO 空置',kind:'button',height:208}
];
function add(id,dev,label,desc,cap=2){const n={id,dev,label,desc,cap};nodes.push(n);nodeMap.set(id,n);}
['L1','L2','L3'].forEach(p=>add('QF.'+p,'QF',p,p+'相输出'));
add('QF.PE','QF','PE','保护接地');
for(let i=1;i<=5;i++){add('FU'+i+'.in','FU','FU'+i+'↑','熔断器'+i+'上端');add('FU'+i+'.out','FU','FU'+i+'↓','熔断器'+i+'下端');}
for(const k of ['KM1','KM2']){
['L1','L2','L3'].forEach((p,i)=>add(k+'.'+p,k,p,(i*2+1)+'/'+p+'主触点上端'));
['T1','T2','T3'].forEach((p,i)=>add(k+'.'+p,k,p,(i*2+2)+'/'+p+'主触点下端'));
['A1','A2'].forEach(p=>add(k+'.'+p,k,p,'接触器线圈'+p));
['NO1','NC1','NC2','NO2'].forEach(p=>{
const t=p.slice(0,2)+(p.endsWith('1')?'₁':'₂');
add(k+'.'+p+'.up',k,t+'↑',p+'辅助触点上端');
add(k+'.'+p+'.down',k,t+'↓',p+'辅助触点下端');
});
}
['L1','L2','L3','T1','T2','T3'].forEach(p=>add('FR.'+p,'FR',p,'热继电器主回路'+p));
['95','96','97','98'].forEach(p=>add('FR.'+p,'FR',p,p==='95'||p==='96'?'过载保护常闭触点':'过载指示常开触点'));
for(let i=1;i<=3;i++){
add('SB'+i+'.NC.up','SB'+i,'1 · NC↑','常闭触点上端1');
add('SB'+i+'.NC.down','SB'+i,'2 · NC↓','常闭触点下端2');
add('SB'+i+'.NO.up','SB'+i,'3 · NO↑','常开触点上端3');
add('SB'+i+'.NO.down','SB'+i,'4 · NO↓','常开触点下端4');
}
['U','V','W','PE'].forEach(p=>add('M.'+p,'M',p,p==='PE'?'电机外壳保护接地':'电机相端子'+p,1));
const reference=[];
function ref(a,b,color,why){reference.push({a,b,color,why});}
const phases=['L1','L2','L3'],phaseColors=['yellow','green','red'];
phases.forEach((p,i)=>ref('QF.'+p,'FU'+(i+1)+'.in',phaseColors[i],'三相电源进入主熔断器'));
phases.forEach((p,i)=>ref('FU'+(i+1)+'.out','KM1.'+p,phaseColors[i],'主熔断器输出接KM1主触点上端'));
phases.forEach((p,i)=>ref('KM1.'+p,'KM2.'+p,phaseColors[i],'两个接触器主回路输入同相并联'));
[1,2,3].forEach(i=>ref('KM1.T'+i,'FR.L'+i,phaseColors[i-1],'正转输出按原相序进入热继电器'));
[1,2,3].forEach(i=>ref('KM2.T'+i,'FR.L'+(4-i),phaseColors[3-i],'反转对调L1、L3；交叉不代表连接'));
['U','V','W'].forEach((p,i)=>ref('FR.T'+(i+1),'M.'+p,phaseColors[i],'热元件下端接电机相端子'));
ref('QF.PE','M.PE','pe','保护地接电机外壳');
ref('QF.L1','FU4.in','yellow','控制回路取L1相');
ref('FU4.out','FR.96','orange','L1经FU4进入FR常闭触点');
ref('FR.95','SB3.NC.up','red','FR常闭串联停止按钮右侧NC上孔');
ref('SB3.NC.down','SB1.NO.up','purple','停止输出接正转启动左侧NO上孔');
ref('SB1.NO.up','SB2.NO.up','purple','两个启动按钮公共端串接');
ref('SB2.NO.up','KM1.NO2.up','purple','公共端接KM1右侧NO自锁输入');
ref('KM1.NO2.up','KM2.NO2.up','purple','两只接触器自锁输入同节点');
ref('SB1.NO.down','KM1.NO2.down','purple','正转按钮与KM1自锁NO并联');
ref('KM1.NO2.down','KM2.NC1.up','purple','正转输出串入KM2左侧NC互锁上孔');
ref('KM2.NC1.down','KM1.A1','teal','反转接触器常闭互锁后接正转线圈');
ref('SB2.NO.down','KM2.NO2.down','teal','反转按钮与KM2自锁NO并联');
ref('KM2.NO2.down','KM1.NC2.up','teal','反转输出串入KM1右侧NC互锁上孔');
ref('KM1.NC2.down','KM2.A1','teal','正转接触器常闭互锁后接反转线圈');
ref('QF.L2','FU5.in','green','控制回路取L2相');
ref('FU5.out','KM1.A2','blue','正转线圈A2经FU5回L2');
ref('KM1.A2','KM2.A2','blue','两只线圈A2并联共用回路');
const colorNames={yellow:'黄',green:'绿',red:'红',purple:'紫',orange:'橙',pink:'粉',blue:'蓝',teal:'青',pe:'黄绿'};
const colorValues={yellow:'var(--yellow)',green:'var(--green)',red:'var(--red)',purple:'var(--purple)',orange:'var(--orange)',pink:'color-mix(in srgb,var(--purple) 55%,var(--red))',blue:'var(--blue)',teal:'color-mix(in srgb,var(--green) 55%,var(--blue))',pe:'var(--green)'};
const model={version:1,circuit:'K2-2',nodes,devices,reference,source:'BV1t8c8eZE1t'};
let wires=[],nextId=1,selected=null,selectedWire=null,hints=[],invalid=[],undo=[];
let power=false,km1=false,km2=false,tripped=false,press={SB1:false,SB2:false,SB3:false};
let coilV=0,motor=false,direction='stop',coilV2=0,phaseGraph=null,view='board',flow=true;
let positions=new Map(),boxMap=new Map(),result=null;
const stateOrigin='k22-'+Math.random().toString(36).slice(2);
function label(id){const n=nodeMap.get(id);return n.dev+' · '+n.label;}
class DSU{
constructor(){this.p=new Map(nodes.map(n=>[n.id,n.id]));}
find(a){let p=this.p.get(a);if(p!==a){p=this.find(p);this.p.set(a,p);}return p;}
join(a,b){if(!this.p.has(a)||!this.p.has(b))return;let x=this.find(a),y=this.find(b);if(x!==y)this.p.set(x,y);}
same(a,b){return this.find(a)===this.find(b);}
}
function bare(){const d=new DSU();wires.forEach(w=>d.join(w.a,w.b));return d;}
const expected=new DSU();reference.forEach(w=>expected.join(w.a,w.b));
const expectedGroups=new Map();
nodes.forEach(n=>{const k=expected.find(n.id);if(!expectedGroups.has(k))expectedGroups.set(k,[]);expectedGroups.get(k).push(n.id);});
const usefulGroups=[...expectedGroups.values()].filter(g=>g.length>1);
function count(id){return wires.filter(w=>w.a===id||w.b===id).length;}
function pushUndo(){undo.push(wires.map(w=>({...w})));if(undo.length>35)undo.shift();}
function message(s,error=false){$('message').textContent=s;$('message').classList.toggle('text-destructive',error);}
function save(){
if(!window.openai||typeof window.openai.setWidgetState!=='function')return;
const privateContent={version:1,circuit:'K2-2',origin:stateOrigin,wires:wires.map(({a,b,color,id})=>({a,b,color,id})),color:$('color').value,view,flow,wireFocus:focusedWire()?{a:focusedWire().a,b:focusedWire().b}:null};
const modelContent={circuit:'K2-2接触器互锁正反转',simulation:{power,km1,km2,direction,coilV,coilV2,tripped},video:'BV1t8c8eZE1t',wireCount:wires.length,correct:result?result.ok:null,selectedWire:focusedWire()?{id:focusedWire().id,a:focusedWire().a,b:focusedWire().b}:null,connections:wires.map(w=>[w.a,w.b])};
window.openai.setWidgetState({modelContent,privateContent}).catch(()=>{});
}
function restore(snapshot){
const s=snapshot?.privateContent||snapshot;
if(!s||s.version!==1||s.circuit!=='K2-2'||!Array.isArray(s.wires)||s.origin===stateOrigin)return;
const packed=ws=>JSON.stringify(ws.map(w=>[w.a,w.b,w.color,w.id]));
if(packed(s.wires)===packed(wires)&&s.view===view&&s.flow===flow&&s.color===$('color').value&&JSON.stringify(s.wireFocus||null)===JSON.stringify(focusedWire()?{a:focusedWire().a,b:focusedWire().b}:null))return;
wires=s.wires.filter(w=>nodeMap.has(w.a)&&nodeMap.has(w.b)&&w.a!==w.b&&colorValues[w.color]).slice(0,80).map((w,i)=>({...w,id:i+1}));
nextId=wires.length+1;power=false;km1=false;km2=false;tripped=false;press={SB1:false,SB2:false,SB3:false};
if(colorValues[s.color])$('color').value=s.color;
view=s.view==='scheme'?'scheme':'board';flow=s.flow!==false;$('view').value=view;$('flow').checked=flow;
result=null;selected=null;selectedWire=wires.find(w=>w.a===s.wireFocus?.a&&w.b===s.wireFocus?.b)?.id||null;hints=[];invalid=[];undo=[];settle();renderAll();
}
function check(render=true){
const d=bare(),errors=[],bad=new Set();let complete=0;
wires.forEach(w=>{if(!expected.same(w.a,w.b)){errors.push('误接：'+label(w.a)+' → '+label(w.b)+'。这两个孔不属于同一电气节点。');bad.add(w.a);bad.add(w.b);}});
nodes.forEach(n=>{if(count(n.id)>n.cap){errors.push(label(n.id)+'超过'+n.cap+'根导线。');bad.add(n.id);}});
usefulGroups.forEach(g=>{
const ok=g.every(n=>d.same(n,g[0]));
if(ok)complete++;
else{
const clusters=new Map();g.forEach(n=>{const k=d.find(n);if(!clusters.has(k))clusters.set(k,[]);clusters.get(k).push(n);});
errors.push('缺线：'+[...clusters.values()].map(ns=>ns.map(label).join('、')).join(' ↔ '));g.forEach(n=>bad.add(n));
}
});
if(wires.length>reference.length&&errors.length===0)errors.push('电气连通正确，但存在多余环线；参考接线为35根，拆除冗余导线后再试。');
result={ok:errors.length===0,errors,complete,total:usefulGroups.length};invalid=[...bad];
if(render){
showResult();message(result.ok?'接线通过：'+usefulGroups.length+'组电气节点连通正确，35根导线，PE完整。可以合闸试运行。':'发现'+errors.length+'项问题，错误孔位已标出。',!result.ok);renderBoard();save();
}
return result;
}
function showResult(){
const el=$('result');el.replaceChildren();el.hidden=!result;if(!result)return;
el.setAttribute('role',result.ok?'status':'alert');
const line=document.createElement('div');line.className=result.ok?'text-small':'text-small text-destructive';
line.textContent=(result.ok?'检查通过':'检查未通过')+' · 电气节点 '+result.complete+' / '+result.total;el.append(line);
if(result.errors.length){
const det=document.createElement('details');det.open=true;
const sum=document.createElement('summary');sum.textContent='查看 '+result.errors.length+' 项检查结果';det.append(sum);
const ul=document.createElement('ul');ul.className='k22-findings text-small';
result.errors.slice(0,15).forEach(e=>{const li=document.createElement('li');li.textContent=e;ul.append(li);});
if(result.errors.length>15){const li=document.createElement('li');li.textContent='其余'+(result.errors.length-15)+'项将在补线后继续检查。';ul.append(li);}
det.append(ul);el.append(det);
}
}
function canEdit(){if(power){message('先分闸，再修改接线。',true);return false;}return true;}
function connect(a,b,color=$('color').value){
if(!canEdit())return false;
if(!nodeMap.has(a)||!nodeMap.has(b)){message('请选择两个有效孔位。',true);return false;}
if(a===b){message('起点和终点不能是同一个孔。',true);return false;}
if(wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a))){message('这两个孔已直接相连。',true);return false;}
if(count(a)>=nodeMap.get(a).cap||count(b)>=nodeMap.get(b).cap){message('孔位已满，请先拆线。单孔最多2根，电机相端子为1根。',true);return false;}
pushUndo();wires.push({id:nextId++,a,b,color});selected=null;selectedWire=null;hints=[];invalid=[];result=null;
message('已接：'+label(a)+' → '+label(b)+' · '+colorNames[color]+'线');settle();renderAll();save();return true;
}
function removeWire(id){

function buildGraph(held1=km1,held2=km2){
const d=bare();
for(let i=1;i<=5;i++)d.join('FU'+i+'.in','FU'+i+'.out');
for(let i=1;i<=3;i++)d.join('FR.L'+i,'FR.T'+i);
if(!tripped)d.join('FR.95','FR.96');else d.join('FR.97','FR.98');
for(let i=1;i<=3;i++){const k='SB'+i;d.join(k+(press[k]?'.NO.up':'.NC.up'),k+(press[k]?'.NO.down':'.NC.down'));}
for(const [k,held] of [['KM1',held1],['KM2',held2]]){
if(held){for(let i=1;i<=3;i++)d.join(k+'.L'+i,k+'.T'+i);}
for(const p of held?['NO1','NO2']:['NC1','NC2'])d.join(k+'.'+p+'.up',k+'.'+p+'.down');
}
return d;
}
function phaseOf(id,d=phaseGraph){if(!power||!d)return null;return phases.find(p=>d.same(id,'QF.'+p))||null;}
function voltage(d,k){if(!power)return 0;const a=phaseOf(k+'.A1',d),b=phaseOf(k+'.A2',d);return a&&b&&a!==b?380:0;}
function cutPower(reason){
power=false;km1=false;km2=false;coilV=0;coilV2=0;motor=false;direction='stop';phaseGraph=buildGraph(false,false);message(reason,true);
}
function settle(){
if(!power){km1=false;km2=false;coilV=0;coilV2=0;motor=false;direction='stop';phaseGraph=buildGraph(false,false);return;}
let stable=false;
for(let i=0;i<8;i++){
const d=buildGraph(km1,km2);
const short=phases.some((p,j)=>phases.slice(j+1).some(q=>d.same('QF.'+p,'QF.'+q)));
if(short){cutPower('检测到相间短接，模拟电源已断开。');return;}
const next1=voltage(d,'KM1')===380,next2=voltage(d,'KM2')===380;
if(next1&&next2){cutPower('两个启动同时请求吸合：仅电气互锁存在竞争，模拟电源已断开。');return;}
if(next1===km1&&next2===km2){stable=true;break;}km1=next1;km2=next2;
}
if(!stable){cutPower('接触器状态无法稳定，模拟电源已断开。');return;}
phaseGraph=buildGraph(km1,km2);coilV=voltage(phaseGraph,'KM1');coilV2=voltage(phaseGraph,'KM2');
const ps=['M.U','M.V','M.W'].map(n=>phaseOf(n));motor=power&&ps.every(Boolean)&&new Set(ps).size===3;
direction=motor?(ps.join(',')==='L1,L2,L3'?'forward':ps.join(',')==='L3,L2,L1'?'reverse':'unknown'):'stop';
}
function setPressed(key,value){
if(!Object.hasOwn(press,key)||press[key]===value)return;
press[key]=value;settle();
if(value&&power&&((key==='SB2'&&km1)||(key==='SB1'&&km2)))message('对方接触器的常闭触点已断开：先按SB3停止，再换向。');
else if(value&&power&&key==='SB1'&&km1)message('KM1吸合，电机正转；松开SB1后由NO₂自锁。');
else if(value&&power&&key==='SB2'&&km2)message('KM2吸合，电机反转；松开SB2后由NO₂自锁。');
else if(value&&power&&key==='SB3')message('SB3停止常闭断开，两只接触器释放。');
renderAll();save();
}
function bindMomentary(id,key){
const el=$(id);
el.addEventListener('pointerdown',e=>{if(e.button!==0)return;try{el.setPointerCapture(e.pointerId);}catch{}setPressed(key,true);});
const release=()=>setPressed(key,false);
el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);el.addEventListener('lostpointercapture',release);
el.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();setPressed(key,true);}});
el.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();setPressed(key,false);}});
el.addEventListener('blur',release);
}
function releaseAll(){Object.keys(press).forEach(k=>{if(press[k])setPressed(k,false);});}
window.addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});
function powerToggle(){

else{
if(!check(false).ok){check();message('接线检查未通过，暂不能合闸。',true);return;}

function wirePath(w,i,wide){

if(a.dev===b.dev&&Math.abs(a.y-b.y)<2){const y=Math.min(ay,by)-6-(i%3)*6;pts=[[a.x,a.y],[a.x,y],[b.x,y],[b.x,b.y]];}
else if(wide&&a.dev!==b.dev&&Math.abs(ab.y-bb.y)<2&&a.dir===b.dir){
const y=a.dir==='up'?Math.min(ay,by)-10-(i%4)*7:Math.max(ay,by)+10+(i%4)*7;pts=[[a.x,a.y],[a.x,y],[b.x,y],[b.x,b.y]];
}else{

if(wide&&a.dev.startsWith('KM')&&b.dev.startsWith('KM')&&a.dev!==b.dev)lane=width/2+(i%5-2)*4;
else lane=i%2===0?6+(i%5)*3:width-6-(i%5)*3;
if(a.dev!==b.dev&&Math.abs(ab.x-bb.x)<2&&ay<by&&Math.abs(by-ay)<150){const y=(ay+by)/2+(i%3-1)*6;pts=[[a.x,a.y],[a.x,ay],[a.x,y],[b.x,y],[b.x,by],[b.x,b.y]];}

}
